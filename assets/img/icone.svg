<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Aluga-se Histórias — AH</title>
  <desc id="desc">Monograma AH em azul e rosa, com um livro aberto, sobre fundo creme arredondado.</desc>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#FAF7F1"/>

  <!-- A com travessa bem definida -->
  <path d="M7.5 34.5 18.5 9.5h5.2l11 25"
        fill="none" stroke="#536C7B" stroke-width="5.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12.7 25.5h16.8"
        fill="none" stroke="#536C7B" stroke-width="4.2"
        stroke-linecap="round"/>

  <!-- H separado visualmente para leitura rápida -->
  <path d="M36.5 12v23m0-11.5h17M53.5 12v23"
        fill="none" stroke="#C95778" stroke-width="5.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Livro aberto -->
  <path d="M6.5 41c8-4.5 16.3-3.8 25.5 4.2 9.2-8 17.5-8.7 25.5-4.2"
        fill="none" stroke="#536C7B" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M7.5 47c8.1-3.8 16-2.6 24.5 4.3 8.5-6.9 16.4-8.1 24.5-4.3"
        fill="none" stroke="#C95778" stroke-width="3" stroke-linecap="round"/>

  <!-- Brilho discreto -->
  <path d="M47 4.5v5m-2.5-2.5h5" stroke="#536C7B" stroke-width="1.6" stroke-linecap="round"/>
</svg>
